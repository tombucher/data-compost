# Configuration centrale du pipeline data-compost.
# Modifier ici plutôt que dans le code. Rechargé à chaque démarrage de main.py.

[paths]
# Répertoire source par défaut (overridable via --input)
default_input = "data/test"
# Répertoire où sont copiés les fichiers d'une clé USB en mode --usb.
# Distinct de default_input : la copie ne doit jamais écraser les fichiers
# d'exemple du projet.
usb_import = "data/usb_import"
# Racine des sorties générées par le pipeline
output_root = "data/output"
# Sous-dossiers spécifiques (relatifs à output_root)
silos_subdir = "silos"
composted_subdir = "composted"
# Nom du sous-dossier d'artefacts de saliency créé à côté des fichiers source
saliency_subdir = "saliency_maps"
# Fichier de log centralisé
log_file = "compost_process.log"

[pipeline]
# Ratio C/N cible pour chaque silo (référence agronomique: ~30)
target_cn_ratio = 30
# Taille max d'un silo en octets (100 Mo par défaut)
silo_size_limit = 104857600
# Seuil d'alerte (Mo) sur le volume total d'entrée
input_size_warning_mb = 5000
# Durée maximale de la phase de compostage, en secondes.
# Au-delà, les fichiers restants ne sont pas compostés — le nombre d'ignorés
# est journalisé. Mettre 0 pour composter la totalité, quel que soit le temps.
compost_time_limit = 55
# Traiter les fichiers cachés (.DS_Store, .gitignore...) comme matière brune.
# false par défaut : ce sont des artefacts du système de fichiers, pas des
# fichiers choisis par l'utilisateur, et leur ratio C/N extrême fausse les silos.
include_hidden_files = false

[usb]
# Intervalle de polling pour la détection des clés USB (secondes)
polling_interval = 2.0

[hardware]
# Forcer la simulation à l'écran même si le matériel est branché.
# Laisser false : la détection est automatique, la simulation prend le relais
# dès qu'un périphérique est absent.
force_simulation = false

# Écran e-paper Waveshare 2.9" — 296x128, piloté en SPI.
# Une dalle e-paper met environ deux secondes par rafraîchissement complet et
# s'use si on l'actualise en continu : on n'écrit que lorsque le contenu a
# changé, et jamais plus souvent que cet intervalle.
epaper_min_refresh_seconds = 20
# Chemin de la bibliothèque Waveshare clonée par install-script.sh
epaper_lib_path = "~/e-Paper/RaspberryPi_JetsonNano/python/lib"

# Écran circulaire Waveshare 4" (C) en DSI : dalle carrée de 720x720 dont seul
# le disque inscrit est visible.
circular_size = 720
# Plein écran sans bordure, à activer sur le Raspberry Pi
fullscreen = false

# Imprimante thermique Epson en ESC/POS direct (identifiant constructeur Epson)
printer_enabled = true
printer_vendor_id = 0x04b8
# Largeur du ticket en caractères, pour un rouleau de 80 mm
printer_columns = 42
